# Production Configuration Profile for VRDMS
# Activate via SPRING_PROFILES_ACTIVE=prod or --spring.profiles.active=prod

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${ALLOWED_ORIGINS}
