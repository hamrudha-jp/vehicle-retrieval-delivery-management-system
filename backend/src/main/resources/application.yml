server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: vehicle-retrieval-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vrdms_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173}

app:
  admin:
    email: ${ADMIN_EMAIL:admin@vrdms.com}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:System Administrator}
    phone: ${ADMIN_PHONE:+910000000000}
